<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ВЭД Интеллект</title>
<style>
/* Layout: оболочка приложения — тёмно-синяя боковая навигация, шапка-баннер, сетка карточек */
:root{
  --bg:#F2F5FA; --card:#FFFFFF; --card-2:#F6F8FC; --ink:#0F1E33; --muted:#66768C; --line:#E1E7F0;
  --navy:#0B1F3A; --navy-2:#122C52; --on-navy:#E8EEF8; --on-navy-muted:#9DB0CC;
  --accent:#1F5FE0; --accent-soft:#E6EEFE; --on-accent:#FFFFFF;
  --ok:#1E9E5A; --ok-soft:#E3F5EA; --warn:#D9860B; --warn-soft:#FDF1DC; --crit:#D93A2B; --crit-soft:#FCE6E3;
  --sea:#E4EEF8; --sea-2:#D3E3F3; --grid:#C9D8EA;
  --c1:#22A06B; --c2:#F2A626; --c3:#1F5FE0; --c4:#8B5CF6; --c5:#F0612E; --c6:#7A8699;
  --font:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0A1422; --card:#101D30; --card-2:#15253B; --ink:#E6EDF7; --muted:#8C9DB5; --line:#1F3049;
  --navy:#07111F; --navy-2:#0F2340; --on-navy:#E6EDF7; --on-navy-muted:#8296B3;
  --accent:#5B8DF5; --accent-soft:#1A2D52; --on-accent:#06101F;
  --ok:#4CC789; --ok-soft:#123323; --warn:#F0B04A; --warn-soft:#3A2A10; --crit:#F2766A; --crit-soft:#3D1C19;
  --sea:#13253C; --sea-2:#183050; --grid:#21395A;
  --c1:#4CC789; --c2:#F0B04A; --c3:#5B8DF5; --c4:#A88BFA; --c5:#F2845A; --c6:#93A1B5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A1422; --card:#101D30; --card-2:#15253B; --ink:#E6EDF7; --muted:#8C9DB5; --line:#1F3049;
  --navy:#07111F; --navy-2:#0F2340; --on-navy:#E6EDF7; --on-navy-muted:#8296B3;
  --accent:#5B8DF5; --accent-soft:#1A2D52; --on-accent:#06101F;
  --ok:#4CC789; --ok-soft:#123323; --warn:#F0B04A; --warn-soft:#3A2A10; --crit:#F2766A; --crit-soft:#3D1C19;
  --sea:#13253C; --sea-2:#183050; --grid:#21395A;
  --c1:#4CC789; --c2:#F0B04A; --c3:#5B8DF5; --c4:#A88BFA; --c5:#F2845A; --c6:#93A1B5; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14.5px;line-height:1.5;font-variant-numeric:tabular-nums;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
h1,h2,h3,h4{margin:0;text-wrap:balance}
button,select,input,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:1400px;margin:0 auto;display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:900px){.app{grid-template-columns:minmax(0,1fr)}}

/* banner */
.banner{grid-column:1/-1;background:var(--navy);color:var(--on-navy);border-radius:16px;padding:18px 22px;display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;position:relative;overflow:hidden;
  background-image:radial-gradient(120% 140% at 85% 0%,var(--navy-2) 0%,transparent 60%),radial-gradient(60% 90% at 100% 100%,rgba(91,141,245,.22),transparent 70%)}
.banner::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(170deg,transparent 0 22px,rgba(255,255,255,.03) 22px 23px);pointer-events:none}
.logo{display:flex;align-items:center;gap:12px;position:relative}
.logo svg{flex:none}
.logo h1{font-size:24px;font-weight:800;letter-spacing:-.01em}
.banner .tag{border-left:1px solid rgba(255,255,255,.2);padding-left:18px;font-weight:600;font-size:15px;max-width:30ch;position:relative}
.banner .sp{flex:1}
.banner .motto{font-size:13.5px;color:var(--on-navy-muted);text-align:right;position:relative}
.testbadge{position:relative;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border:1px dashed var(--c2);color:var(--c2);padding:3px 8px;border-radius:5px}

/* nav */
.nav{background:var(--navy);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:max(16px,env(safe-area-inset-top,0px))}
.nav button{display:flex;align-items:center;gap:12px;border:0;background:transparent;color:var(--on-navy);padding:10px 12px;border-radius:10px;cursor:pointer;font-weight:600;text-align:left;white-space:nowrap}
.nav button:hover{background:rgba(255,255,255,.07)}
.nav button[aria-current="page"]{background:var(--accent);color:#fff}
.nav svg{width:20px;height:20px;flex:none}
.nav .sep{height:1px;background:rgba(255,255,255,.1);margin:8px 4px}
.nav .sel{padding:6px 8px 4px;font-size:11.5px;color:var(--on-navy-muted);font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.nav select{margin:0 4px 6px;background:var(--navy-2);color:var(--on-navy);border:1px solid rgba(255,255,255,.12);border-radius:8px;padding:7px 8px;max-width:100%}
@media (max-width:900px){.nav{position:static;flex-direction:row;overflow-x:auto;padding:8px}.nav .sep,.nav .sel{display:none}.nav select{margin:0 4px;min-width:160px}}

.page{display:flex;flex-direction:column;gap:16px;min-width:0}
.grid{display:grid;gap:16px}
.g-3{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.g-eq3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g-2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:1150px){.g-eq3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:760px){.g-3,.g-eq3,.g-2{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;min-width:0;display:flex;flex-direction:column;gap:12px}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.card h3{font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px}
.lead{color:var(--muted);font-size:13.5px;margin:0;max-width:75ch}
.ph{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px}
.ph h2{font-size:22px;font-weight:800;letter-spacing:-.01em}
.link{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:0;font-size:13.5px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.sm{padding:4px 10px;font-size:12.5px;border-radius:8px}
.btn.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.crit{background:var(--crit-soft);color:var(--crit)} .pill.na{background:var(--card-2);color:var(--muted)} .pill.acc{background:var(--accent-soft);color:var(--accent)}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.notice{font-size:13px;color:var(--muted);background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:10px 14px}
.notice b{color:var(--ink)}

/* kv */
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:9px 18px;font-size:14px;margin:0}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:600}

/* map */
.map{border-radius:12px;overflow:hidden;background:var(--sea)}
.map svg{display:block;width:100%;height:auto}
.mlabel{font:700 12px var(--font);fill:var(--ink)}
.mlabel-s{font:600 10.5px var(--font);fill:var(--muted)}

/* donut */
.donut{display:grid;grid-template-columns:124px minmax(0,1fr);gap:14px;align-items:center}
.donut svg{width:124px;height:124px}
@media (max-width:420px){.donut{grid-template-columns:minmax(0,1fr)}}
.legend-list{display:flex;flex-direction:column;gap:7px;font-size:13px;min-width:0}
.legend-list div{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}

/* threats */
.threats{display:flex;flex-direction:column;gap:12px}
.threat{display:grid;grid-template-columns:22px minmax(0,1fr);gap:10px}
.threat .n{font-weight:600}
.threat .s{font-size:12.5px;color:var(--muted)}
.checks{display:flex;flex-direction:column;gap:9px;margin:0;padding:0;list-style:none}
.checks li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:8px}

/* tables */
.tscroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
thead th{font-size:12px;color:var(--muted);font-weight:700;background:var(--card-2)}
td.r,th.r{text-align:right;white-space:nowrap}
tr.total td{font-weight:800;border-top:2px solid var(--ink);border-bottom:0}
tr.click{cursor:pointer} tr.click:hover td{background:var(--card-2)}
.sub{font-size:12px;color:var(--muted);font-weight:500}

/* stepper */
.stepper{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;position:relative}
.step{display:flex;flex-direction:column;gap:4px;font-size:12.5px;position:relative;padding-top:22px;min-width:0}
.step::before{content:"";position:absolute;top:6px;left:0;right:0;height:2px;background:var(--line)}
.step.done::before,.step.cur::before{background:var(--accent)}
.step i{position:absolute;top:0;left:0;width:14px;height:14px;border-radius:50%;background:var(--card);border:2px solid var(--line)}
.step.done i{background:var(--accent);border-color:var(--accent)}
.step.cur i{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.step b{font-weight:700;overflow-wrap:anywhere} .step span{color:var(--muted)}

/* checklist */
.crow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 14px;padding:11px 0;border-top:1px solid var(--line);align-items:center}
.crow:first-child{border-top:0;padding-top:0}
.crow .t{font-weight:600} .crow .n{font-size:12.5px;color:var(--muted)}
.crow .meta{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;margin-top:4px;align-items:center}
@media (max-width:560px){.crow{grid-template-columns:minmax(0,1fr)}}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--card);padding:5px 10px;font-size:12.5px;cursor:pointer;border-left:1px solid var(--line);font-weight:600;color:var(--muted)}
.seg button:first-child{border-left:0}
.seg button[aria-pressed="true"].v-done{background:var(--ok-soft);color:var(--ok)}
.seg button[aria-pressed="true"].v-work{background:var(--warn-soft);color:var(--warn)}
.seg button[aria-pressed="true"].v-none{background:var(--crit-soft);color:var(--crit)}

/* plan */
.plan{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.plan li{display:grid;grid-template-columns:26px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:10px}
.plan .no{width:26px;height:26px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:800;font-size:12.5px}
.plan li.applied{background:var(--ok-soft);border-color:transparent}
.plan li.applied .no{background:var(--ok);color:var(--card)}
@media (max-width:560px){.plan li{grid-template-columns:26px minmax(0,1fr)}.plan li>:last-child{grid-column:2}}

/* scenarios */
.opt{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr) auto;gap:8px 16px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px}
.opt.best{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok)}
@media (max-width:760px){.opt{grid-template-columns:minmax(0,1fr)}}
.opt .on{font-weight:700} .opt .od{font-size:12.5px;color:var(--muted)}
.opt .param{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
.opt .param input{width:120px;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--card-2)}
.bar{height:22px;display:flex;border-radius:5px;overflow:hidden;background:var(--card-2)}
.bar .c{background:var(--accent)} .bar .x{background:repeating-linear-gradient(135deg,var(--crit) 0 2px,var(--crit-soft) 2px 7px)}
.opt .ov{text-align:right;min-width:150px}
.opt .ov .big{font-weight:800;font-size:16px}
.opt .ov .sm{font-size:12px;color:var(--muted)}
@media (max-width:760px){.opt .ov{text-align:left}}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:6px}

/* kpi */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:1100px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;min-width:0}
.kpi .k{font-size:12.5px;color:var(--muted);font-weight:600}
.kpi .v{font-size:24px;font-weight:800;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi .h{font-size:12px;color:var(--muted)}
.kpi.hero{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.kpi.hero .k,.kpi.hero .h{color:var(--on-accent);opacity:.85}

/* hbars */
.hb{display:flex;flex-direction:column;gap:10px}
.hb div.r{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr) 110px;gap:10px;align-items:center;font-size:13px}
.hb .track{height:14px;background:var(--card-2);border-radius:4px;overflow:hidden}
.hb .fill{height:100%;border-radius:4px}
@media (max-width:560px){.hb div.r{grid-template-columns:minmax(0,1fr) 100px}.hb .track{grid-column:1/-1;grid-row:2}}

/* forms */
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12.5px;color:var(--muted);font-weight:600}
.field input,.field select{padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card-2);width:100%}
.field .hint{font-size:11.5px;color:var(--muted)}
.gt{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--accent)}

/* matrix */
.mx td,.mx th{text-align:center}
.mx td:first-child,.mx th:first-child{text-align:left}
.mx th.us,.mx td.us{background:var(--accent-soft)}
.mx thead th.us{background:var(--accent);color:var(--on-accent)}
.mk{display:inline-block;width:20px;height:20px;vertical-align:middle}
.vendors{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.vendor{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;background:var(--card)}
.vendor h4{font-size:15px;font-weight:800}
.vendor ul{margin:0;padding-left:18px;font-size:12.5px}
.vendor .gap{font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}

.flow{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.flow div{background:var(--card-2);border-radius:12px;padding:12px;font-size:13px}
.flow b{display:block;font-size:14px;margin-bottom:4px}
.flow div.hl{background:var(--navy);color:var(--on-navy)}
@media (max-width:760px){.flow{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}}

.report{white-space:pre-wrap;font-size:13px;background:var(--card-2);border:1px solid var(--line);border-radius:10px;padding:14px;max-height:420px;overflow:auto;margin:0;font-family:var(--font)}
.doclist{display:flex;flex-direction:column;gap:10px}
.doc{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center}
.doc .ic{width:36px;height:36px;border-radius:9px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-size:14px;z-index:20;font-weight:600}
.events{display:flex;flex-direction:column;gap:0;margin:0;padding:0;list-style:none}
.events li{display:grid;grid-template-columns:14px minmax(0,1fr);gap:10px;padding-bottom:12px;position:relative}
.events li::before{content:"";position:absolute;left:6px;top:14px;bottom:0;width:2px;background:var(--line)}
.events li:last-child::before{display:none}
.events i{width:14px;height:14px;border-radius:50%;background:var(--accent);margin-top:3px;box-shadow:0 0 0 3px var(--accent-soft)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Mobile-first improvements */
@media(max-width:760px){
 body{padding:8px 8px 24px;font-size:14px;overflow-x:hidden}
 .app{gap:9px;display:flex;flex-direction:column;max-width:100%}
 .banner{width:100%;padding:14px;border-radius:12px;gap:8px}
 .logo h1{font-size:20px}.logo svg{width:34px;height:34px}
 .banner .tag{border:0;padding:0;font-size:12px;max-width:100%}
 .banner .motto{display:none}.banner .sp{display:none}
 .nav{width:100%;position:sticky;top:0;z-index:20;flex-wrap:nowrap;overflow-x:auto;overscroll-behavior-x:contain;border-radius:10px;padding:5px;gap:2px;scrollbar-width:thin}
 .nav button{padding:10px 11px;min-height:44px;gap:5px;font-size:12px;flex-shrink:0}
 .nav svg{width:16px;height:16px}
 .nav select{min-width:170px;max-width:200px}
 .page{width:100%;min-width:0;gap:10px}
 .card{min-width:0;max-width:100%;overflow-wrap:anywhere;padding:14px}
 .ph{flex-wrap:wrap;gap:10px}.ph h2{font-size:22px}
 .kpis{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
 .kpi .v{font-size:clamp(18px,5vw,27px)}
 .row{flex-wrap:wrap}.btn{min-height:44px}
 .grid,.g-3,.g-2,.g-eq3,.opt,.flow{grid-template-columns:minmax(0,1fr)}
 table{font-size:12px} .table-wrap,.tbl-wrap{max-width:100%;overflow-x:auto}
 input,select,textarea{max-width:100%;font-size:16px}
 .case-grid{grid-template-columns:1fr!important}
}
.case-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.case-card{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--card);min-width:0}
.case-card h3{margin:6px 0 8px}.case-card p{margin:6px 0;color:var(--muted)}
.case-sum{font-size:24px;font-weight:800;color:var(--ink);margin:10px 0}
.case-note{padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--card-2);margin-bottom:14px}
.case-card a,.case-note a{overflow-wrap:anywhere}
.qr-section{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.qr-section img{width:160px;height:160px;background:#fff;padding:9px;border-radius:12px}
</style>
<style>body{margin:0}[hidden]{display:none!important}</style>
</head>
<body>


<div class="app">
  <header class="banner">
    <div class="logo">
      <svg width="44" height="44" viewBox="0 0 44 44" fill="none" aria-hidden="true"><rect x="1" y="1" width="42" height="42" rx="12" stroke="#5B8DF5" stroke-width="2"/><path d="M12 28l7-9 6 5 7-11" stroke="#8FB3FF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="12" cy="28" r="2.6" fill="#E8EEF8"/><circle cx="19" cy="19" r="2.6" fill="#E8EEF8"/><circle cx="25" cy="24" r="2.6" fill="#E8EEF8"/><circle cx="32" cy="13" r="2.6" fill="#F2A626"/></svg>
      <h1>ВЭД Интеллект</h1>

/* ============ расчёт ============ */
function pFor(status,slack,A){if(status==='done')return 0;const t=A.probs[status]||A.probs.none;
  if(slack>=10)return t[0];if(slack>=3)return t[1];if(slack>=0)return t[2];return t[3];}
const finDay=v=>v.cargoValue*(v.costs.capitalRate/100)/365;

function smp(v,o={}){
  const A=S.A,factor=o.factor??1,entry=addDays(parse(v.entry),o.shift||0),rule=iceRule(v.iceClass,v.iceCond);
  const filingDL=subWork(entry,A.leadWorkDays),permitDL=addDays(entry,-A.permitBuffer);
  const rows=ITEMS.map(it=>{const required=it.conditional?rule.escort:true;const status=required?(v.items[it.key]||'none'):'na';
    const dl=it.kind==='permit'?permitDL:filingDL,slack=diff(dl,today);return{...it,required,status,dl,slack,p:required?pFor(status,slack,A)*factor:0}});
  const open=rows.filter(r=>r.required&&r.status!=='done');
  const pFail=1-rows.reduce((m,r)=>m*(1-r.p),1);
  let pRefuse,pDelay;
  if(!rule.compliant){pRefuse=0.9;pDelay=0.1*pFail*(1-A.refuseShare)}else{pRefuse=pFail*A.refuseShare;pDelay=pFail*(1-A.refuseShare)}
  if(o.alt){pRefuse=0;pDelay=A.altP}
  const c=v.costs,fin=finDay(v),D=A.delayDays,R=A.refuseDays;
  const delay={direct:D*(c.vesselDay+c.storageDay),indirect:Math.max(0,D-c.graceDays)*c.penaltyDay+D*fin};
  const refuse={direct:c.replaceCost+c.extraLogistics+c.customs+R*c.storageDay,indirect:Math.max(0,R-c.graceDays)*c.penaltyDay+R*fin+c.lostProfit};
  const E=pDelay*(delay.direct+delay.indirect)+pRefuse*(refuse.direct+refuse.indirect);
  return{entry,rule,rows,open,pDelay,pRefuse,pTotal:pDelay+pRefuse,delay,refuse,E,filingDL,permitDL,
    ready:rows.filter(r=>!r.required||r.status==='done').length+(rule.compliant?1:0),total:rows.length+1};
}

function risks(v){
  const out=[];
  if(v.type==='smp'){
    const base=smp(v),after=smp(v,{factor:S.A.urgentFactor});
    if(base.open.length||!base.rule.compliant||v.urgentApplied){
      out.push({id:'smp-doc',auto:true,cat:'doc',name:base.rule.compliant?'Срыв окна допуска на СМП':'Отказ в допуске: судно не соответствует критериям',
        detail:base.open.length?'Не хватает: '+base.open.map(x=>x.short).join(', '):'Документы закрыты',
        p:base.pTotal,pAfter:base.rule.compliant?after.pTotal:base.pTotal,Ebase:base.E,Eafter:base.rule.compliant?after.E:base.E,
        loss:base.pTotal?base.E/base.pTotal:0,window:'документы до '+fdate(base.filingDL),
        action:base.rule.compliant&&base.open.length?'Срочно закрыть: '+base.open.map(x=>x.short).join(', '):(!base.rule.compliant?'Заменить судно или выбрать другой маршрут':''),
        actionCost:base.rule.compliant?v.opt.urgentCost:0,applied:!!v.urgentApplied});
    }
  }
  (v.risks||[]).forEach(x=>{const loss=x.direct+x.indirect;out.push({...x,loss,Ebase:x.p*loss,Eafter:x.pAfter*loss})});
  out.forEach(x=>{x.pEff=x.applied?x.pAfter:x.p;x.E=x.applied?x.Eafter:x.Ebase;x.saving=x.Ebase-x.Eafter-(x.actionCost||0);
    x.level=x.pEff>=0.3||x.E>=1e7?'crit':x.pEff>=0.15?'warn':'ok'});
  return out.sort((a,b)=>b.E-a.E);
}

function summary(v){
  const R=risks(v),E=R.reduce((s,x)=>s+x.E,0),measures=R.filter(x=>x.applied).reduce((s,x)=>s+(x.actionCost||0),0);
  const pAny=1-R.reduce((m,x)=>m*(1-x.pEff),1);
  const c=v.costs,daily=c.vesselDay+c.storageDay+finDay(v);
  const byCat={};Object.keys(CATS).forEach(k=>byCat[k]=0);R.forEach(x=>byCat[x.cat]+=x.E);
  const s=v.type==='smp'?smp(v,{factor:v.urgentApplied?S.A.urgentFactor:1}):null;
  const lvl=(s&&!s.rule.compliant)||pAny>=0.6?'crit':pAny>=0.3?'warn':'ok';
  const recs=R.filter(x=>x.action&&!x.applied&&x.saving>0).sort((a,b)=>b.saving-a.saving);
  return{R,E,measures,pAny,daily,byCat,s,lvl,recs};
}
const LVL={ok:'Под контролем',warn:'Есть риски',crit:'Высокий риск'};

function scenarios(v){
  const R=risks(v),c=v.costs,fin=finDay(v),list=[];
  const other=R.filter(x=>!x.auto).reduce((s,x)=>s+x.E,0),otherNoSmp=R.filter(x=>!x.auto&&!x.smpOnly).reduce((s,x)=>s+x.E,0);
  if(v.type==='smp'){
    const f=v.urgentApplied?S.A.urgentFactor:1,base=smp(v,{factor:f});
    list.push({name:'Оставить как есть',desc:'Текущий план и уже принятые меры',certain:0,risk:base.E+other});
    if(!v.urgentApplied&&base.open.length&&base.rule.compliant){const r=smp(v,{factor:S.A.urgentFactor});
      list.push({name:'Срочно закрыть документы',desc:'Оформление через агента: вероятность по открытым пунктам ×'+String(S.A.urgentFactor).replace('.',','),param:['urgentCost','Затраты, ₽'],certain:v.opt.urgentCost,risk:r.E+other,apply:'urgent'})}
    {const K=v.opt.shiftDays,r=smp(v,{shift:K,factor:f});
      list.push({name:'Сдвинуть дату входа',desc:'Новая дата входа '+fdate(r.entry)+', сроки подачи сдвигаются вместе с ней',param:['shiftDays','Сдвиг, сут'],
        certain:K*(c.vesselDay+c.storageDay+fin)+Math.max(0,K-c.graceDays)*c.penaltyDay,risk:r.E+other})}
    if(v.opt.altExtraDays>0||v.opt.altExtraCost>0){const r=smp(v,{alt:true}),K=v.opt.altExtraDays;
      list.push({name:'Альтернативный маршрут',desc:'Без захода в акваторию СМП: дольше и дороже, но без риска допуска и льда',param:['altExtraDays','Доп. сутки'],param2:['altExtraCost','Доп. фрахт, ₽'],
        certain:v.opt.altExtraCost+K*fin+Math.max(0,K-c.graceDays)*c.penaltyDay,risk:r.E+otherNoSmp})}
  }else{
    const E=R.reduce((s,x)=>s+x.E,0);
    list.push({name:'Текущий маршрут',desc:v.routeText||'',certain:0,risk:E});
    (v.scenarios||[]).forEach(sc=>list.push({name:sc.name,desc:sc.desc+' · '+(sc.extraDays<0?'на '+dn(-sc.extraDays)+' быстрее':'на '+dn(sc.extraDays)+' дольше')+' · риск ×'+String(sc.riskFactor).replace('.',','),
      certain:sc.extraCost+sc.extraDays*fin+Math.max(0,sc.extraDays-c.graceDays)*c.penaltyDay,risk:E*sc.riskFactor}));
  }
  list.forEach(x=>x.total=x.certain+x.risk);
  list.reduce((a,b)=>b.total<a.total?b:a).best=true;
  return list;
}

}

function riskTable(R,full){
  return `<table><thead><tr><th>Риск</th>${full?'<th>Категория</th><th>Окно</th>':''}<th class="r">Вероятность</th>${full?'<th class="r">Потери</th>':''}<th class="r">Ожидаемо</th>${full?'<th>Мера</th>':''}</tr></thead><tbody>
  ${R.map(x=>`<tr><td><span class="row" style="gap:8px;flex-wrap:nowrap"><span class="dot" style="background:var(--${x.level})"></span><span>${esc(x.name)}${x.detail&&full?`<br><span class="sub">${esc(x.detail)}</span>`:''}${x.vname?`<br><span class="sub">${esc(x.vname)}</span>`:''}</span></span></td>
   ${full?`<td><span class="pill na"><span class="dot" style="background:var(${CATC[x.cat]})"></span>${CATS[x.cat]}</span></td><td class="sub">${esc(x.window||'')}</td>`:''}
   <td class="r">${x.applied?`<s class="sub">${pct(x.p)}</s> `:''}${pct(x.pEff)}</td>${full?`<td class="r">${rs(x.loss)}</td>`:''}<td class="r"><b>${rs(x.E)}</b></td>
   ${full?`<td>${x.action?(x.applied?'<span class="pill ok">принята</span>':`<button class="btn sm" type="button" data-act="apply" data-rid="${x.id}" data-vid="${x.vid||''}">Выполнить</button>`):'<span class="sub">—</span>'}</td>`:''}</tr>`).join('')}
  </tbody></table>`;
}

function reportList(){
  const items=[['risk','Отчёт по рискам поставки'],['fin','Финансовая оценка срыва'],['exec','Сводка для руководителя']];
  return `<div class="doclist">${items.map(([k,t])=>`<div class="doc"><span class="ic">${ico('doc',18)}</span><div><b>${t}</b><div class="sub">формируется из текущих данных</div></div><button class="btn sm" type="button" data-act="report" data-k="${k}">Открыть</button></div>`).join('')}</div>`;
}

function smpChart(){
  const W=360,H=200,L=34,B=24,T=24,R=12,x=y=>L+(y-2024)/(2035-2024)*(W-L-R),yv=t=>H-B-(t/160)*(H-B-T);
  const ticks=[0,40,80,120,160].map(t=>`<line x1="${L}" x2="${W-R}" y1="${yv(t)}" y2="${yv(t)}" stroke="var(--line)"/><text x="${L-6}" y="${yv(t)+4}" text-anchor="end" style="font:600 10.5px var(--font);fill:var(--muted)">${t}</text>`).join('');
  const yrs=[2024,2026,2028,2030,2032,2035].map(y=>`<text x="${x(y)}" y="${H-6}" text-anchor="middle" style="font:600 10.5px var(--font);fill:var(--muted)">${y}</text>`).join('');
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Грузопоток по СМП: 37,9 млн т в 2024, ориентир 110–150 млн т к 2035">${ticks}${yrs}
   <polygon points="${x(2024)},${yv(37.9)} ${x(2035)},${yv(150)} ${x(2035)},${yv(110)}" fill="var(--accent)" opacity=".16"/>
   <line x1="${x(2024)}" y1="${yv(37.9)}" x2="${x(2035)}" y2="${yv(130)}" stroke="var(--accent)" stroke-width="2.4" stroke-dasharray="5 4"/>
   <circle cx="${x(2024)}" cy="${yv(37.9)}" r="5" fill="var(--accent)"/><text x="${x(2024)+8}" y="${yv(37.9)+16}" style="font:700 11px var(--font);fill:var(--ink)">37,9 · факт 2024</text>
   <rect x="${x(2035)-78}" y="${yv(150)-20}" width="72" height="18" rx="5" fill="var(--accent)"/><text x="${x(2035)-42}" y="${yv(150)-7}" text-anchor="middle" style="font:700 11px var(--font);fill:var(--on-accent)">110–150</text></svg>`;
}

function ship(){
  return `<div class="ph"><div><h2>Поставки</h2><p class="lead">Все поставки с оценкой стоимости срыва. Нажмите на строку, чтобы открыть карточку.</p></div><button class="btn pri" type="button" data-act="new">+ Новая поставка</button></div>
  <section class="card"><div class="tscroll"><table><thead><tr><th>№</th><th>Поставка</th><th>Этап</th><th>Статус</th><th class="r">Риск срыва</th><th class="r">Ожидаемая стоимость срыва</th></tr></thead><tbody>
  ${S.voyages.map(v=>{const sm=summary(v);return `<tr class="click" data-open="${v.id}"><td><b>${esc(v.no)}</b><br><span class="sub">${v.type==='smp'?'кейс СМП':'обычная поставка'}</span></td><td>${esc(v.cargo)}<br><span class="sub">${esc(v.from)} → ${esc(v.to)}</span></td><td>${STAGES[v.type][v.stage]}</td><td><span class="pill ${sm.lvl}">${LVL[sm.lvl]}</span></td><td class="r">${pct(sm.pAny)}</td><td class="r"><b>${rs(sm.E)}</b></td></tr>`}).join('')}
  </tbody></table></div></section>`;
}

function card(v){
  const sm=summary(v),s=sm.s;
  const slack=x=>x.status==='done'?'':x.slack<0?`<span class="pill crit">срок прошёл ${dn(-x.slack)} назад</span>`:`<span class="pill ${x.slack<3?'crit':x.slack<10?'warn':'na'}">осталось ${dn(x.slack)}</span>`;
  const plan=sm.R.filter(x=>x.action);
  return `<div class="ph"><div><h2>Поставка № ${esc(v.no)}</h2><p class="lead">${esc(v.cargo)} · ${esc(v.from)} → ${esc(v.to)}</p></div>
    <div class="row"><span class="pill ${sm.lvl}">${LVL[sm.lvl]}</span><button class="btn" type="button" data-act="stage" data-d="-1">← Этап</button><button class="btn" type="button" data-act="stage" data-d="1">Этап →</button><button class="btn" type="button" data-act="del">Удалить</button></div></div>
  <section class="card">${stepper(v)}</section>
  <div class="grid g-3">
    <section class="card"><h3>Общий риск поставки</h3>
      <div class="kpis" style="grid-template-columns:repeat(3,minmax(0,1fr))">
        <div class="kpi hero"><div class="k">Ожидаемая стоимость срыва</div><div class="v">${rs(sm.E)}</div></div>
        <div class="kpi"><div class="k">Вероятность срыва</div><div class="v" style="color:var(--${sm.lvl})">${pct(sm.pAny)}</div></div>
        <div class="kpi"><div class="k">Потери за сутки</div><div class="v">${rs(sm.daily)}</div></div></div>
      <div class="tscroll">${riskTable(sm.R,true)}</div></section>
    <section class="card"><h3>Данные о поставке</h3>${shipInfo(v,sm)}${routeMap(v)}</section>
  </div>
  ${v.type==='smp'?`<section class="card"><h3>Условия допуска на СМП</h3>
    <p class="lead">Сроки от даты входа ${fdate(s.entry)}: документы к заявлению за ${S.A.leadWorkDays} раб. дней (до ${fdate(s.filingDL)}), разрешение за ${S.A.permitBuffer} сут до входа (до ${fdate(s.permitDL)}). Перечень упрощён и требует сверки с действующими Правилами плавания в акватории СМП.</p>
    <div>
      <div class="crow"><div><div class="t">Соответствие судна критериям допуска</div><div class="n">Ледовый класс ${esc(v.iceClass)}, ледовые условия «${COND[v.iceCond].toLowerCase()}», проводка ${s.rule.escort?'требуется':'не требуется'}</div></div>
        <div>${s.rule.compliant?'<span class="pill ok">Соответствует</span>':'<span class="pill crit">Не соответствует</span>'}</div></div>
      ${smp(v).rows.map(x=>`<div class="crow"><div><div class="t">${esc(x.title)}</div><div class="n">${esc(x.note)}</div>
        ${x.required?`<div class="meta"><span>срок <b>${fdate(x.dl)}</b></span>${slack(x)}${x.p>0?`<span>вклад в риск <b>${pct(x.p)}</b></span>`:''}</div>`:''}</div>
        <div>${x.required?`<span class="seg" role="group" aria-label="Статус">${['done','work','none'].map(st=>`<button type="button" class="v-${st}" data-act="item" data-item="${x.key}" data-status="${st}" aria-pressed="${x.status===st}">${STATUS[st]}</button>`).join('')}</span>`:'<span class="pill na">Не требуется</span>'}</div></div>`).join('')}
    </div></section>`:''}
  <div class="grid g-2">
    <section class="card"><h3>План действий</h3><p class="lead">Меры отсортированы по снижению ожидаемых потерь. Вы принимаете решение и фиксируете его в платформе.</p>
      <ol class="plan">${plan.map((x,i)=>`<li class="${x.applied?'applied':''}"><span class="no">${i+1}</span><div><b>${esc(x.action)}</b><div class="sub">${x.applied?'принята':'экономия '+rs(x.saving)}${x.actionCost?' · затраты '+rs(x.actionCost):''} · риск ${pct(x.p)} → ${pct(x.pAfter)}</div></div>
        ${x.applied?`<button class="btn sm" type="button" data-act="unapply" data-rid="${x.id}">Отменить</button>`:`<button class="btn sm pri" type="button" data-act="apply" data-rid="${x.id}">Выполнить</button>`}</li>`).join('')||'<li><span></span><span class="lead">Мер нет</span></li>'}</ol>
      <button class="link" type="button" data-page="scen" style="align-self:flex-start">Сравнить сценарии →</button></section>
    <section class="card"><h3>Последние события</h3><ul class="events">${[...v.events].reverse().slice(0,7).map(e=>`<li><i></i><div><b>${fdate(parse(e.date))}</b><div>${esc(e.text)}</div></div></li>`).join('')}</ul></section>

function riskPage(){
  const all=[];S.voyages.forEach(v=>risks(v).forEach(x=>all.push({...x,vid:v.id,vname:v.no+' · '+v.from+' → '+v.to})));
  all.sort((a,b)=>b.E-a.E);const f=S.riskFilter||'all';const list=f==='all'?all:all.filter(x=>x.cat===f);
  const tot=list.reduce((s,x)=>s+x.E,0);
  return `<div class="ph"><div><h2>Реестр рисков</h2><p class="lead">Все риски по всем поставкам, по убыванию ожидаемых потерь.</p></div></div>
  <div class="row">${[['all','Все']].concat(Object.entries(CATS)).map(([k,t])=>`<button type="button" class="btn sm ${f===k?'pri':''}" data-act="rf" data-k="${k}">${t}</button>`).join('')}</div>
  <section class="card"><div class="tscroll">${riskTable(list,true)}</div><div class="row" style="justify-content:space-between"><span class="sub">${list.length} ${plural(list.length,'риск','риска','рисков')}</span><b>Итого ожидаемо: ${rs(tot)}</b></div></section>`;
}

function scenPage(v){
  const L=scenarios(v),mx=Math.max(...L.map(o=>o.total),1),best=L.find(o=>o.best);
  return `<div class="ph"><div><h2>Сценарное сравнение</h2><p class="lead">Поставка № ${esc(v.no)}. Итог варианта = гарантированные затраты + оставшийся ожидаемый риск. Наименьшие ожидаемые потери: «${esc(best.name)}», ${rs(best.total)}. Решение за вами.</p></div></div>
  <section class="card">
   ${L.map(o=>`<div class="opt ${o.best?'best':''}"><div><div class="on">${esc(o.name)} ${o.best?'<span class="pill ok">наименьшие потери</span>':''}</div><div class="od">${esc(o.desc)}</div>
     ${o.param?`<label class="param">${o.param[1]} <input type="number" min="0" id="op-${o.param[0]}" data-opt="${o.param[0]}" value="${v.opt[o.param[0]]}"></label>`:''}
     ${o.param2?`<label class="param">${o.param2[1]} <input type="number" min="0" id="op-${o.param2[0]}" data-opt="${o.param2[0]}" value="${v.opt[o.param2[0]]}"></label>`:''}
     ${o.apply?`<div style="margin-top:8px"><button class="btn sm pri" type="button" data-act="apply" data-rid="smp-doc">Выбрать этот вариант</button></div>`:''}</div>
     <div class="bar" title="затраты ${rub(o.certain)}, риск ${rub(o.risk)}"><span class="c" style="width:${Math.max(0,o.certain)/mx*100}%"></span><span class="x" style="width:${o.risk/mx*100}%"></span></div>
     <div class="ov"><div class="big">${rs(o.total)}</div><div class="sm">затраты ${rs(o.certain)} · риск ${rs(o.risk)}</div></div></div>`).join('')}
   <div class="legend"><span><i style="background:var(--accent)"></i>Гарантированные затраты (отрицательные = экономия)</span><span><i style="background:repeating-linear-gradient(135deg,var(--crit) 0 2px,var(--crit-soft) 2px 7px)"></i>Ожидаемый риск</span></div>
  </section>
  ${v.type==='smp'?smpBreakdown(v):''}`;
}

function smpBreakdown(v){const r=smp(v,{factor:v.urgentApplied?S.A.urgentFactor:1});
  return `<section class="card"><h3>Как считается риск допуска на СМП</h3><p class="lead">Ожидаемая стоимость = Σ вероятность события × (прямые потери + косвенные потери)</p><div class="tscroll"><table>
  <thead><tr><th>Событие</th><th class="r">Вероятность</th><th class="r">Прямые</th><th class="r">Косвенные</th><th class="r">Ожидаемо</th></tr></thead><tbody>
  <tr><td>Задержка допуска на ${S.A.delayDays} сут<br><span class="sub">простой судна и хранение · неустойка после ${v.costs.graceDays} сут, стоимость капитала</span></td><td class="r">${pct(r.pDelay)}</td><td class="r">${rub(r.delay.direct)}</td><td class="r">${rub(r.delay.indirect)}</td><td class="r">${rub(r.pDelay*(r.delay.direct+r.delay.indirect))}</td></tr>
  <tr><td>Отказ в допуске и замена рейса<br><span class="sub">новый фрахт, доп. логистика, хранение ${S.A.refuseDays} сут · неустойка, капитал, упущенная выгода</span></td><td class="r">${pct(r.pRefuse)}</td><td class="r">${rub(r.refuse.direct)}</td><td class="r">${rub(r.refuse.indirect)}</td><td class="r">${rub(r.pRefuse*(r.refuse.direct+r.refuse.indirect))}</td></tr>
  <tr class="total"><td>Итого по допуску</td><td class="r">${pct(r.pTotal)}</td><td></td><td></td><td class="r">${rub(r.E)}</td></tr></tbody></table></div></section>`;}

function analytics(){
  const rows=S.voyages.map(v=>({v,sm:summary(v)})),mx=Math.max(...rows.map(r=>r.sm.E),1);
  const cat={};Object.keys(CATS).forEach(k=>cat[k]=0);rows.forEach(r=>Object.keys(CATS).forEach(k=>cat[k]+=r.sm.byCat[k]));
  const mc=Math.max(...Object.values(cat),1),tot=rows.reduce((s,r)=>s+r.sm.E,0),meas=rows.reduce((s,r)=>s+r.sm.measures,0);
  const saved=rows.reduce((s,r)=>s+r.sm.R.filter(x=>x.applied).reduce((a,x)=>a+x.Ebase-x.Eafter,0),0);
  return `<div class="ph"><div><h2>Аналитика портфеля</h2><p class="lead">Сводка по всем поставкам: где сосредоточены ожидаемые потери и сколько удалось предотвратить.</p></div></div>
  <div class="kpis">
    <div class="kpi hero"><div class="k">Ожидаемые потери портфеля</div><div class="v">${rs(tot)}</div><div class="h">${rows.length} ${plural(rows.length,'поставка','поставки','поставок')}</div></div>
    <div class="kpi"><div class="k">Снижено принятыми мерами</div><div class="v" style="color:var(--ok)">${rs(saved)}</div><div class="h">ожидаемых потерь</div></div>
    <div class="kpi"><div class="k">Затраты на меры</div><div class="v">${rs(meas)}</div><div class="h">гарантированные</div></div>
    <div class="kpi"><div class="k">Поставок с высоким риском</div><div class="v" style="color:var(--crit)">${rows.filter(r=>r.sm.lvl==='crit').length}</div><div class="h">из ${rows.length}</div></div>
  </div>
  <div class="grid g-2">
    <section class="card"><h3>Ожидаемая стоимость срыва по поставкам</h3><div class="hb">${rows.sort((a,b)=>b.sm.E-a.sm.E).map(r=>`<div class="r"><span>${esc(r.v.no)}<br><span class="sub">${esc(r.v.from)} → ${esc(r.v.to)}</span></span><span class="track"><span class="fill" style="display:block;width:${r.sm.E/mx*100}%;background:var(--${r.sm.lvl})"></span></span><b style="text-align:right">${rs(r.sm.E)}</b></div>`).join('')}</div></section>
    <section class="card"><h3>По категориям риска</h3><div class="hb">${Object.keys(CATS).sort((a,b)=>cat[b]-cat[a]).map(k=>`<div class="r"><span>${CATS[k]}</span><span class="track"><span class="fill" style="display:block;width:${cat[k]/mc*100}%;background:var(${CATC[k]})"></span></span><b style="text-align:right">${rs(cat[k])}</b></div>`).join('')}</div></section>
    <section class="card"><h3>Грузопоток по СМП, млн т</h3>${smpChart()}<p class="lead">По данным Росатома, в 2024 году по СМП перевезено около 37,9 млн т, из них транзит более 3 млн т (92 рейса). Ориентир на 2035 год — 110–150 млн т. Международный транзит, по прогнозу Атомфлота, раньше 2029 года ожидать не стоит.</p></section>

function report(v,k){
  const sm=summary(v),L=scenarios(v),best=L.find(o=>o.best),hdr=`ВЭД Интеллект · Поставка № ${v.no}\n${v.cargo}, ${v.volume} · ${v.from} → ${v.to}\nДата отчёта: ${fdate(today)} · демо-данные\n`;
  if(k==='risk')return hdr+`\nВероятность хотя бы одного срыва: ${pct(sm.pAny)}\nОжидаемая стоимость срыва: ${rub(sm.E)}\n\nРиски:\n`+sm.R.map((x,i)=>`${i+1}. ${x.name} [${CATS[x.cat]}]\n   вероятность ${pct(x.pEff)}, потери ${rub(x.loss)}, ожидаемо ${rub(x.E)}${x.window?'\n   окно: '+x.window:''}${x.action?'\n   мера: '+x.action+(x.applied?' (принята)':''):''}`).join('\n')+`\n\nВероятности — сценарная оценка с явными допущениями.`;
  if(k==='fin')return hdr+`\nСтоимость груза: ${rub(v.cargoValue)}\nПотери за сутки задержки: ${rub(sm.daily)}\n  простой транспорта ${rub(v.costs.vesselDay)}, хранение ${rub(v.costs.storageDay)}, капитал ${rub(finDay(v))}\nНеустойка: ${rub(v.costs.penaltyDay)}/сут после ${v.costs.graceDays} сут\n\nОжидаемая стоимость срыва: ${rub(sm.E)}\nПо категориям:\n`+Object.keys(CATS).filter(c=>sm.byCat[c]>0).map(c=>`  ${CATS[c]}: ${rub(sm.byCat[c])}`).join('\n')+`\n\nСценарии (затраты + риск):\n`+L.map(o=>`  ${o.best?'★ ':''}${o.name}: ${rub(o.total)} (затраты ${rub(o.certain)}, риск ${rub(o.risk)})`).join('\n');
  const rec=sm.recs[0];
  return hdr+`\nСтатус: ${LVL[sm.lvl]}\nСколько может стоить срыв: ${rs(sm.E)} ожидаемо, ${rs(sm.daily)} за каждые сутки задержки.\nНасколько вероятно: ${pct(sm.pAny)} (сценарная оценка).\nГлавная угроза: ${sm.R[0]?sm.R[0].name:'нет'}.\nЧто сделать сейчас: ${rec?rec.action+' — снизит ожидаемые потери на '+rs(rec.saving):'новых мер не требуется'}.\nЛучший сценарий по ожидаемым потерям: ${best.name} (${rs(best.total)}).\n\nРешение принимает ответственный за поставку.`;
}

function applyRisk(v,rid,on){
  if(rid==='smp-doc'){v.urgentApplied=on}else{const r=(v.risks||[]).find(x=>x.id===rid);if(!r)return;r.applied=on}
  const name=rid==='smp-doc'?'Срочное оформление документов СМП':(v.risks.find(x=>x.id===rid)||{}).action;
  v.events.push({date:iso(today),text:(on?'Принята мера: ':'Отменена мера: ')+name});
}
document.addEventListener('click',e=>{
  const t=e.target.closest('button,tr[data-open]');if(!t)return;
  if(t.dataset.case){S.caseId=t.dataset.case;go('caseStudy');return}
  if(t.dataset.open){S.selected=t.dataset.open;go('card');return}
  if(t.dataset.page){go(t.dataset.page);return}
  const a=t.dataset.act,v=cur();if(!a)return;
  if(a==='apply'||a==='unapply'){const tv=t.dataset.vid?S.voyages.find(x=>x.id===t.dataset.vid):v;applyRisk(tv,t.dataset.rid,a==='apply');save();render();toast(a==='apply'?'Мера принята, оценка пересчитана':'Мера отменена');return}
  if(a==='item'){v.items[t.dataset.item]=t.dataset.status;if(t.dataset.item==='app'&&t.dataset.status==='none')v.items.permit='none';save();render();return}
  if(a==='stage'){v.stage=Math.max(0,Math.min(4,v.stage+ +t.dataset.d));v.pos=Math.min(v.nodes.length-1,Math.round(v.stage/4*(v.nodes.length-1)));v.events.push({date:iso(today),text:'Этап: '+STAGES[v.type][v.stage]});save();render();return}
  if(a==='del'){t.outerHTML='<span class="row">Удалить поставку? <button class="btn pri" type="button" data-act="delYes">Удалить</button><button class="btn" type="button" data-page="card">Отмена</button></span>';return}
  if(a==='delYes'){S.voyages=S.voyages.filter(x=>x.id!==S.selected);S.selected=S.voyages[0]?.id||null;go('ship');toast('Поставка удалена');return}
  if(a==='new'){go('newShip');return}
  if(a==='rf'){S.riskFilter=t.dataset.k;save();render();return}
  if(a==='report'){S.report=t.dataset.k;go('docs');return}
  if(a==='copy'){copy($('#rep').textContent);return}
  if(a==='resetA'){S.A=clone(DEFAULT_A);save();render();toast('Допущения сброшены');return}
  if(a==='resetAll'){S=seed();S.selected=S.voyages[0].id;save();render();toast('Демо-данные восстановлены');return}
});
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='shipSel'){S.selected=el.value;save();render();return}
  if(el.dataset.opt){cur().opt[el.dataset.opt]=Math.max(0,parseFloat(el.value)||0);save();render();return}
  if(el.tagName==='SELECT'&&el.dataset.k){cur()[el.dataset.k]=el.value;save();renderNav();}
});
document.addEventListener('input',e=>{
  const el=e.target,v=cur();if(!v||!el.closest('#page')||el.closest('#newForm'))return;
  const num=x=>Math.max(0,parseFloat(x)||0);
  if(el.dataset.k&&el.tagName!=='SELECT')v[el.dataset.k]=el.dataset.num?num(el.value):el.value;
  else if(el.dataset.c)v.costs[el.dataset.c]=num(el.value);
  else if(el.dataset.o)v.opt[el.dataset.o]=num(el.value);
  else if(el.dataset.a)S.A[el.dataset.a]=num(el.value);
  else if(el.dataset.p)S.A.probs[el.dataset.p][+el.dataset.i]=Math.min(100,num(el.value))/100;
  else return;
  save();if(['no','from','to'].includes(el.dataset.k))renderNav();
});

    costs:type==='smp'?{vesselDay:1000000,storageDay:100000,penaltyDay:500000,graceDays:5,replaceCost:25000000,extraLogistics:3000000,customs:0,lostProfit:10000000,capitalRate:18}
      :{vesselDay:40000,storageDay:15000,penaltyDay:100000,graceDays:3,replaceCost:0,extraLogistics:0,customs:0,lostProfit:0,capitalRate:18},
    nodes:type==='smp'?[[from,80,200],['Карские Ворота',185,160],['Диксон',300,128],[to,520,110]]:[[from,610,252],['Перевалка',540,190],[to,90,212]]};
  if(type==='smp')Object.assign(v,{entry:g('n-entry'),iceClass:'Arc5',iceCond:'medium',items:{app:'none',insurance:'none',escort:'none',permit:'none'},opt:{shiftDays:7,urgentCost:400000,altExtraDays:0,altExtraCost:0},risks:[]});
  else{const val=v.cargoValue;Object.assign(v,{routeText:from+' → '+to,scenarios:[],risks:[
    {id:uid(),name:'Классификация товара по ТН ВЭД',cat:'customs',p:0.25,direct:Math.round(val*0.04),indirect:Math.round(val*0.01),window:'при выпуске',action:'Проверить классификацию у брокера',actionCost:60000,pAfter:0.08},
    {id:uid(),name:'Задержка в порту перевалки',cat:'transport',p:0.25,direct:300000,indirect:200000,window:'в пути',action:'Забронировать вывоз с терминала',actionCost:40000,pAfter:0.12},
    {id:uid(),name:'Срыв срока поставки покупателю',cat:'time',p:0.2,direct:0,indirect:Math.round(val*0.03),window:'к '+fdate(parse(g('n-end'))),action:'Согласовать окно поставки',actionCost:0,pAfter:0.1}]})}
  S.voyages.push(v);S.selected=v.id;go('card');toast('Поставка создана');
});
function copy(txt){const ok=()=>toast('Скопировано');try{navigator.clipboard.writeText(txt).then(ok,()=>fb(txt))}catch(e){fb(txt)}}
function fb(txt){const ta=document.createElement('textarea');ta.value=txt;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();let r=false;try{r=document.execCommand('copy')}catch(e){}ta.remove();toast(r?'Скопировано':'Выделите текст и скопируйте вручную')}
let tt;function toast(m){const el=$('#toast');el.textContent=m;el.hidden=false;clearTimeout(tt);tt=setTimeout(()=>el.hidden=true,2200)}
render();
})();
